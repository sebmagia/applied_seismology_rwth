# Tests the course environment on Windows, macOS and Linux, and runs the four notebooks.
# Works when this folder is the root of a GitHub repository: Actions tab ->
# "Test the course environment" -> "Run workflow". It also runs when the environment
# files or notebooks change, and once a month (new package releases can break an environment).
name: Test the course environment

on:
  workflow_dispatch:
  push:
    paths:
      - environment.yml
      - requirements.txt
      - check_environment.py
      - download_data.py
      - "*.ipynb"
      - .github/workflows/test-environment.yml
  schedule:
    - cron: "17 5 1 * *"

jobs:
  conda:
    name: conda (environment.yml), ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v5
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: applied-seismology
      - name: Installed packages
        run: conda list
      - name: Check the environment
        run: python check_environment.py

  pip:
    name: pip (requirements.txt), ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: CPU-only PyTorch (Linux)
        if: runner.os == 'Linux'
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install requirements.txt
        run: python -m pip install -r requirements.txt
      - name: Check the environment
        run: python check_environment.py

  notebooks:
    name: run the four notebooks (Linux)
    needs: conda
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v5
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: applied-seismology
      - name: Download the data, map data and PhaseNet weights
        run: python download_data.py --extras
      - name: Execute the notebooks
        run: |
          mkdir -p executed
          for nb in *.ipynb; do
            echo "::group::$nb"
            jupyter nbconvert --to notebook --execute --ExecutePreprocessor.timeout=3600 --output-dir executed "$nb"
            echo "::endgroup::"
          done
      - name: Keep the executed notebooks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebooks
          path: executed/
